<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ドローン配達ゲーム - Drone Delivery</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 50%, #f1f5f9 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
    }
    #game-container {
      position: relative;
      width: min(100vw, calc(100dvh * 2 / 3), 430px);
      height: min(100dvh, calc(100vw * 3 / 2), 645px);
      aspect-ratio: 2 / 3;
      background-color: #ffffff;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(2, 132, 199, 0.18);
    }
    @media (max-width: 430px) {
      #game-container {
        border-radius: 14px;
      }
    }
    canvas {
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, #38bdf8 0%, #bae6fd 55%, #e0f2fe 100%);
      display: block;
      cursor: pointer;
    }
    /* ボタンエリア（リザルト画面用） */
    #result-actions {
      display: none;
      position: absolute;
      bottom: 7.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 82%;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }
    /* メインボタン（リンク遷移用） */
    #next-link-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 13px 20px;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      font-size: clamp(14px, 4.2vw, 16px);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      border-radius: 999px;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    #next-link-btn:active {
      transform: scale(0.96);
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
    }
    /* サブボタン（もう一度あそぶ） */
    #retry-btn {
      padding: 8px 20px;
      background: rgba(255, 255, 255, 0.92);
      color: #64748b;
      font-size: clamp(11.5px, 3.3vw, 13px);
      font-weight: 600;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.12s ease;
    }
    #retry-btn:active {
      transform: scale(0.95);
      background-color: #f1f5f9;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas" width="640" height="960"></canvas>
  <div id="result-actions">
    <a id="next-link-btn" href="https://lil18325.github.io/2040rinia/?unlock=3">次へ進む →</a>
    <button id="retry-btn" type="button">もう一度あそぶ</button>
  </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const resultActions = document.getElementById("result-actions");
const retryBtn = document.getElementById("retry-btn");

// 高画質化（2倍スケール）の設定
ctx.scale(2, 2);
const V_WIDTH = 320;
const V_HEIGHT = 480;

const craneImg = new Image();
craneImg.src = "img/kure-n.png";

let gameState = "START";
let frames = 0;
let passedPipesCount = 0;
const TOTAL_PIPES_TO_GOAL = 7;
let goalTimer = null;
let goalStartTime = 0;
const GOAL_SCENE_DURATION = 4000; // 4秒間表示

// 総飛行距離（ピクセル換算で残り距離を計算）
const PIPE_INTERVAL_PX = 140 * 1.4; // 196px
const TOTAL_DISTANCE_PX = PIPE_INTERVAL_PX * TOTAL_PIPES_TO_GOAL + 180;
let traveledPx = 0;

// 背景キラキラ粒子用
const particles = Array.from({ length: 15 }, () => ({
  x: Math.random() * V_WIDTH,
  y: Math.random() * V_HEIGHT,
  size: Math.random() * 2.5 + 1,
  speedY: Math.random() * 0.4 + 0.1,
  opacity: Math.random() * 0.4 + 0.2
}));

// プレイヤー（自機ドローン）
const drone = {
  x: 50,
  y: 162,
  width: 30,
  height: 24,
  gravity: 0.18,
  jump: -4.0,
  velocity: 0,
  rotation: 0,

  draw() {
    ctx.save();
    const idleFloat = (gameState === "START") ? Math.sin(frames * 0.08) * 4 : 0;
    ctx.translate(this.x + 15, this.y + 12 + idleFloat);
    
    this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 8, this.velocity * 0.08));
    ctx.rotate(this.rotation);

    // 脚
    ctx.strokeStyle = "#475569";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-12, -2); ctx.lineTo(-15, -10);
    ctx.moveTo(12, -2);  ctx.lineTo(15, -10);
    ctx.stroke();

    // モーター
    ctx.fillStyle = "#334155";
    ctx.fillRect(-17, -12, 4, 3);
    ctx.fillRect(13, -12, 4, 3);

    // プロペラ
    ctx.fillStyle = (Math.floor(frames / 2) % 2 === 0) ? "rgba(255,255,255,0.9)" : "rgba(100,116,139,0.4)";
    ctx.fillRect(-21, -13, 12, 2);
    ctx.fillRect(9, -13, 12, 2);

    // 本体
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(-12, -6, 24, 10, 3);
    ctx.fill();
    ctx.stroke();

    // ライト
    ctx.fillStyle = "#0284c7";
    ctx.beginPath();
    ctx.arc(6, -1, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // 紐
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, 4); ctx.lineTo(0, 10);
    ctx.stroke();

    // 荷物
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(-5, 10, 10, 9);
    ctx.strokeStyle = "#D8DCDF";
    ctx.strokeRect(-5, 10, 10, 9);

    ctx.restore();
  },

  update() {
    this.velocity += this.gravity;
    this.y += this.velocity;

    if (this.y + this.height >= V_HEIGHT - 10) {
      this.y = V_HEIGHT - 10 - this.height;
      triggerGameOver();
    }

    if (this.y <= 0) {
      this.y = 0;
      this.velocity = 0;
    }
  },

  flap() {
    if (gameState === "PLAYING") {
      this.velocity = this.jump;
    }
  },

  reset() {
    this.y = 162;
    this.velocity = 0;
    this.rotation = 0;
  }
};

// ゴールゲート
const goalGate = {
  active: false,
  x: V_WIDTH + 60,
  width: 68,

  spawn() {
    this.active = true;
    this.x = V_WIDTH + 40;
  },

  reset() {
    this.active = false;
    this.x = V_WIDTH + 60;
  },

  update() {
    if (!this.active) return;
    this.x -= pipes.dx;

    if (drone.x + drone.width / 2 >= this.x + 18) {
      this.active = false;
      triggerGoalScene();
    }
  },

  draw() {
    if (!this.active) return;

    const gateX = this.x;
    const gateW = this.width;
    const topY = 95;
    const bottomY = V_HEIGHT - 65;
    const gateH = bottomY - topY;

    ctx.save();

    const glowGrad = ctx.createLinearGradient(gateX, topY, gateX + gateW, topY);
    glowGrad.addColorStop(0, "rgba(255, 255, 255, 0.1)");
    glowGrad.addColorStop(0.5, "rgba(255, 255, 255, 0.45)");
    glowGrad.addColorStop(1, "rgba(255, 255, 255, 0.1)");
    ctx.fillStyle = glowGrad;
    ctx.fillRect(gateX + 8, topY, gateW - 16, gateH);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(gateX + 4, topY, 6, gateH + 20);
    ctx.fillRect(gateX + gateW - 10, topY, 6, gateH + 20);

    ctx.fillStyle = "#0284c7";
    for (let sy = topY + 10; sy < bottomY + 10; sy += 24) {
      ctx.fillRect(gateX + 4, sy, 6, 12);
      ctx.fillRect(gateX + gateW - 10, sy, 6, 12);
    }

    ctx.shadowColor = "rgba(2, 132, 199, 0.35)";
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 3;
    ctx.fillStyle = "#0284c7";
    ctx.beginPath();
    ctx.roundRect(gateX - 10, topY - 26, gateW + 20, 32, 16);
    ctx.fill();

    ctx.shadowColor = "transparent";
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(gateX - 10, topY - 26, gateW + 20, 32, 16);
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 14px Arial";
    ctx.textAlign = "center";
    ctx.fillText("GOAL", gateX + gateW / 2, topY - 5);

    const arrowAlpha = 0.5 + Math.sin(frames * 0.15) * 0.5;
    ctx.fillStyle = `rgba(2, 132, 199, ${arrowAlpha})`;
    ctx.font = "bold 18px Arial";
    ctx.fillText("▶▶", gateX + gateW / 2, (topY + bottomY) / 2 + 6);

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.roundRect(gateX - 14, bottomY, gateW + 28, 24, 12);
    ctx.fill();
    ctx.strokeStyle = "#0284c7";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = "#0284c7";
    ctx.font = "bold 9.5px Arial";
    ctx.fillText("ファンテックラボ", gateX + gateW / 2, bottomY + 15);

    ctx.restore();
  }
};

// 障害物
const pipes = {
  position: [],
  width: 60,
  gap: 155,
  dx: 1.4,
  spawningActive: true,
  spawnedCount: 0,

  drawEnemyDrone(x, baseY, offsetFrame) {
    const hoverY = baseY + Math.sin((frames + offsetFrame) * 0.08) * 6;

    ctx.save();
    ctx.translate(x + 30, hoverY);

    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-12, -2); ctx.lineTo(-15, -10);
    ctx.moveTo(12, -2);  ctx.lineTo(15, -10);
    ctx.stroke();

    ctx.fillStyle = "#1e293b";
    ctx.fillRect(-17, -12, 4, 3);
    ctx.fillRect(13, -12, 4, 3);

    ctx.fillStyle = (Math.floor(frames / 2) % 2 === 0) ? "rgba(148,163,184,0.8)" : "rgba(71,85,105,0.4)";
    ctx.fillRect(-21, -13, 12, 2);
    ctx.fillRect(9, -13, 12, 2);

    ctx.fillStyle = "#475569";
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(-12, -6, 24, 10, 3);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#0f172a";
    ctx.beginPath();
    ctx.arc(6, -1, 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, 4); ctx.lineTo(0, 10);
    ctx.stroke();

    ctx.fillStyle = "#64748b";
    ctx.fillRect(-5, 10, 10, 9);
    ctx.strokeStyle = "#475569";
    ctx.strokeRect(-5, 10, 10, 9);

    ctx.restore();
  },

  drawBuilding(x, y, width, height) {
    ctx.fillStyle = "#475569";
    ctx.fillRect(x, y, width, height);
    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, width, height);

    const windowColors = ["#94a3b8", "#cbd5e1", "#64748b"];
    let colorIdx = 0;
    for (let wy = y + 12; wy < y + height - 10; wy += 22) {
      for (let wx = x + 10; wx < x + width - 10; wx += 16) {
        ctx.fillStyle = windowColors[colorIdx % windowColors.length];
        ctx.fillRect(wx, wy, 10, 12);
        colorIdx++;
      }
    }
  },

  draw() {
    for (let i = 0; i < this.position.length; i++) {
      let p = this.position[i];
      let topYPos = p.y;
      let bottomYPos = p.y + this.gap;

      this.drawEnemyDrone(p.x, topYPos - 25, p.offsetFrame);

      ctx.strokeStyle = "#475569";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p.x + 30, 0);
      ctx.lineTo(p.x + 30, topYPos - 25);
      ctx.stroke();

      const availableHeight = V_HEIGHT - bottomYPos;

      if (p.type === "crane") {
        const craneWidth = Math.min(this.width, availableHeight * (200 / 300));
        ctx.drawImage(craneImg, p.x + (this.width - craneWidth) / 2, bottomYPos, craneWidth, availableHeight);
      } else {
        this.drawBuilding(p.x, bottomYPos, this.width, availableHeight);
      }
    }
  },

  update() {
    traveledPx += this.dx;

    if (this.spawningActive && frames % 140 === 0) {
      if (this.spawnedCount < TOTAL_PIPES_TO_GOAL) {
        const minY = 75;
        const maxY = V_HEIGHT - this.gap - 100;
        const randomY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;

        this.position.push({
          x: V_WIDTH,
          y: randomY,
          passed: false,
          offsetFrame: frames,
          type: Math.random() > 0.5 ? "crane" : "building"
        });
        this.spawnedCount++;
      } else {
        this.spawningActive = false;
        goalGate.spawn();
      }
    }

    for (let i = 0; i < this.position.length; i++) {
      let p = this.position[i];
      p.x -= this.dx;

      let droneLeft = drone.x + 4;
      let droneRight = drone.x + drone.width - 4;
      let droneTop = drone.y + 4;
      let droneBottom = drone.y + drone.height - 4;

      if (droneRight > p.x + 10 && droneLeft < p.x + this.width - 10) {
        if (droneTop < p.y - 10) {
          triggerGameOver();
        }
        if (droneBottom > p.y + this.gap + 12) {
          triggerGameOver();
        }
      }

      if (p.x + this.width < drone.x && !p.passed) {
        p.passed = true;
        passedPipesCount++;
      }

      if (p.x + this.width <= 0) {
        this.position.shift();
        i--;
      }
    }
  },

  reset() {
    this.position = [];
    this.spawningActive = true;
    this.spawnedCount = 0;
  }
};

// 空中背景
function drawBackground() {
  ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
  ctx.beginPath();
  ctx.arc((frames * 0.2) % (V_WIDTH + 100) - 50, 80, 24, 0, Math.PI * 2);
  ctx.arc((frames * 0.2) % (V_WIDTH + 100) - 32, 72, 30, 0, Math.PI * 2);
  ctx.arc((frames * 0.2) % (V_WIDTH + 100) - 10, 80, 24, 0, Math.PI * 2);
  ctx.fill();
}

// 上部のゴールまでの距離ゲージ（HUD）
function drawDistanceHUD() {
  const hudX = 16;
  const hudY = 14;
  const hudW = V_WIDTH - 32;
  const hudH = 42;

  const progress = Math.min(1, Math.max(0, traveledPx / TOTAL_DISTANCE_PX));
  const remainingMeters = Math.max(0, Math.ceil((1 - progress) * 350));

  ctx.save();
  ctx.shadowColor = "rgba(2, 132, 199, 0.14)";
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 3;
  ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
  ctx.beginPath();
  ctx.roundRect(hudX, hudY, hudW, hudH, 14);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = "rgba(56, 189, 248, 0.4)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(hudX, hudY, hudW, hudH, 14);
  ctx.stroke();

  ctx.textAlign = "left";
  ctx.fillStyle = "#64748b";
  ctx.font = "bold 9.5px Arial";
  ctx.fillText("目的地：ファンテックラボ", hudX + 12, hudY + 15);

  ctx.textAlign = "right";
  if (remainingMeters > 0) {
    ctx.fillStyle = "#0284c7";
    ctx.font = "bold 11px Arial";
    ctx.fillText(`ゴールまで あと ${remainingMeters}m`, hudX + hudW - 12, hudY + 15);
  } else {
    ctx.fillStyle = "#10b981";
    ctx.font = "bold 11px Arial";
    ctx.fillText("まもなく到着！", hudX + hudW - 12, hudY + 15);
  }

  const barX = hudX + 12;
  const barY = hudY + 24;
  const barW = hudW - 36;
  const barH = 7;

  ctx.fillStyle = "#e2e8f0";
  ctx.beginPath();
  ctx.roundRect(barX, barY, barW, barH, 4);
  ctx.fill();

  const fillW = Math.max(8, barW * progress);
  const barGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
  barGrad.addColorStop(0, "#38bdf8");
  barGrad.addColorStop(1, "#0284c7");
  ctx.fillStyle = barGrad;
  ctx.beginPath();
  ctx.roundRect(barX, barY, fillW, barH, 4);
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.strokeStyle = "#0284c7";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(barX + fillW, barY + barH / 2, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  const flagX = barX + barW + 10;
  const flagY = barY + barH / 2;
  ctx.strokeStyle = "#0284c7";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(flagX - 2, flagY + 5);
  ctx.lineTo(flagX - 2, flagY - 5);
  ctx.stroke();

  ctx.fillStyle = "#ef4444";
  ctx.beginPath();
  ctx.moveTo(flagX - 2, flagY - 5);
  ctx.lineTo(flagX + 6, flagY - 2);
  ctx.lineTo(flagX - 2, flagY + 1);
  ctx.closePath();
  ctx.fill();
}

// ★ ファンテックラボ（FUN-TECH LABO）着陸シーン（ローディング表示付き） ★
function drawGoalScene() {
  let grad = ctx.createLinearGradient(0, 0, 0, V_HEIGHT);
  grad.addColorStop(0, "#38bdf8");
  grad.addColorStop(0.5, "#bae6fd");
  grad.addColorStop(1, "#f1f5f9");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

  // 奥の緑フェンス壁
  ctx.fillStyle = "#15803d";
  ctx.fillRect(100, 220, 120, 70);
  ctx.strokeStyle = "#166534";
  ctx.lineWidth = 1;
  for (let x = 105; x < 220; x += 10) {
    ctx.beginPath(); ctx.moveTo(x, 220); ctx.lineTo(x, 290); ctx.stroke();
  }

  // 中央の白屋根通路
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(110, 210, 100, 10);
  ctx.strokeStyle = "#cbd5e1";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(110, 210, 100, 10);

  // 柱
  ctx.strokeStyle = "#94a3b8";
  ctx.lineWidth = 2.5;
  for (let px = 120; px <= 200; px += 26) {
    ctx.beginPath(); ctx.moveTo(px, 220); ctx.lineTo(px, 290); ctx.stroke();
  }

  // 左側の建物（AMAI）
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.moveTo(-20, 180);
  ctx.lineTo(110, 205);
  ctx.lineTo(105, 300);
  ctx.lineTo(-20, 300);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#cbd5e1";
  ctx.lineWidth = 2;
  ctx.stroke();

  // 左ガラス窓
  ctx.fillStyle = "rgba(186, 230, 253, 0.4)";
  ctx.fillRect(-15, 205, 110, 75);
  ctx.strokeStyle = "#94a3b8";
  ctx.strokeRect(-15, 205, 110, 75);

  // AMAIロゴ
  ctx.fillStyle = "#64748b";
  ctx.font = "bold 13px Arial";
  ctx.textAlign = "left";
  ctx.fillText("AMAI", 15, 225);

  // 右側の建物（FUN-TECH LABO）
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.moveTo(210, 205);
  ctx.lineTo(340, 180);
  ctx.lineTo(340, 300);
  ctx.lineTo(215, 300);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "#cbd5e1";
  ctx.lineWidth = 2;
  ctx.stroke();

  // 右ガラス窓
  ctx.fillStyle = "rgba(186, 230, 253, 0.4)";
  ctx.fillRect(220, 205, 110, 75);
  ctx.strokeStyle = "#94a3b8";
  ctx.strokeRect(220, 205, 110, 75);

  // FUN-TECH LABO カラフルロゴ
  ctx.font = "bold 13px Arial";
  ctx.textAlign = "left";
  ctx.fillStyle = "#38bdf8"; ctx.fillText("FUN-", 225, 228);
  ctx.fillStyle = "#22c55e"; ctx.fillText("TECH ", 257, 228);
  ctx.fillStyle = "#eab308"; ctx.fillText("LABO", 294, 228);

  // 手前のアプローチアスファルト地面
  ctx.fillStyle = "#64748b";
  ctx.beginPath();
  ctx.moveTo(0, 290);
  ctx.lineTo(V_WIDTH, 290);
  ctx.lineTo(V_WIDTH, V_HEIGHT);
  ctx.lineTo(0, V_HEIGHT);
  ctx.closePath();
  ctx.fill();

  // ステップ階段
  ctx.fillStyle = "#cbd5e1";
  ctx.fillRect(40, 285, 240, 6);

  // ヘリポート風マーク
  ctx.textAlign = "center";
  ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(V_WIDTH / 2, V_HEIGHT - 40, 16, 0, Math.PI * 2);
  ctx.stroke();

  // メッセージ
  ctx.fillStyle = "#0f172a";
  ctx.font = "bold 20px Arial";
  ctx.fillText("ファンテックラボに到着！", V_WIDTH / 2, 54);

  // ★ 画面遷移までのローディングピル＆プログレスバー ★
  const elapsed = Date.now() - goalStartTime;
  const loadProgress = Math.min(1, Math.max(0, elapsed / GOAL_SCENE_DURATION));

  const pillW = 200;
  const pillH = 38;
  const pillX = (V_WIDTH - pillW) / 2;
  const pillY = 70;

  ctx.save();
  ctx.shadowColor = "rgba(2, 132, 199, 0.14)";
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 3;
  ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
  ctx.beginPath();
  ctx.roundRect(pillX, pillY, pillW, pillH, 14);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = "rgba(56, 189, 248, 0.45)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(pillX, pillY, pillW, pillH, 14);
  ctx.stroke();

  // 回転スピナーアイコン
  const spinnerX = pillX + 26;
  const spinnerY = pillY + 14;
  ctx.save();
  ctx.translate(spinnerX, spinnerY);
  ctx.rotate(frames * 0.14);
  ctx.strokeStyle = "#e2e8f0";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, 5.5, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = "#0284c7";
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.arc(0, 0, 5.5, 0, Math.PI * 1.2);
  ctx.stroke();
  ctx.restore();

  // ローディングテキスト
  ctx.textAlign = "left";
  ctx.fillStyle = "#0369a1";
  ctx.font = "bold 10.5px Arial";
  ctx.fillText("完了画面へ移動しています...", spinnerX + 12, pillY + 17.5);

  // ローディングゲージレール
  const lBarX = pillX + 16;
  const lBarY = pillY + 25;
  const lBarW = pillW - 32;
  const lBarH = 5;

  ctx.fillStyle = "#e2e8f0";
  ctx.beginPath();
  ctx.roundRect(lBarX, lBarY, lBarW, lBarH, 3);
  ctx.fill();

  const lBarGrad = ctx.createLinearGradient(lBarX, 0, lBarX + lBarW, 0);
  lBarGrad.addColorStop(0, "#38bdf8");
  lBarGrad.addColorStop(1, "#0284c7");
  ctx.fillStyle = lBarGrad;
  ctx.beginPath();
  ctx.roundRect(lBarX, lBarY, Math.max(6, lBarW * loadProgress), lBarH, 3);
  ctx.fill();

  // 影
  const hoverOffset = Math.sin(frames * 0.08) * 6;
  const centerX = V_WIDTH / 2;
  const centerY = V_HEIGHT / 2 + 50 + hoverOffset;

  const shadowY = V_HEIGHT - 40;
  const shadowScale = 1 - (hoverOffset / 30);
  ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
  ctx.beginPath();
  ctx.ellipse(centerX, shadowY, 32 * shadowScale, 8 * shadowScale, 0, 0, Math.PI * 2);
  ctx.fill();

  // ドローン
  ctx.save();
  ctx.translate(centerX, centerY);
  ctx.scale(0.9, 0.9);

  ctx.strokeStyle = "#475569";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-12, -2); ctx.lineTo(-15, -10);
  ctx.moveTo(12, -2);  ctx.lineTo(15, -10);
  ctx.stroke();

  ctx.fillStyle = "#334155";
  ctx.fillRect(-17, -12, 4, 3);
  ctx.fillRect(13, -12, 4, 3);

  ctx.fillStyle = (Math.floor(frames / 2) % 2 === 0) ? "rgba(100,116,139,0.8)" : "rgba(203,213,225,0.5)";
  ctx.fillRect(-21, -13, 12, 2);
  ctx.fillRect(9, -13, 12, 2);

  ctx.fillStyle = "#ffffff";
  ctx.strokeStyle = "#94a3b8";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(-12, -6, 24, 10, 3);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "#0284c7";
  ctx.beginPath();
  ctx.arc(6, -1, 2.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, 4); ctx.lineTo(0, 10);
  ctx.stroke();

  ctx.fillStyle = "#ffffff";
  ctx.fillRect(-5, 10, 10, 9);
  ctx.strokeStyle = "#D8DCDF";
  ctx.strokeRect(-5, 10, 10, 9);

  ctx.restore();

  ctx.textAlign = "center";
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 14px Arial";
  ctx.fillText("荷物が無事に届けられました", V_WIDTH / 2, V_HEIGHT - 12);
}

// リザルト画面（白背景・リンクボタン配置）
function drawGoalResult() {
  let bgGrad = ctx.createLinearGradient(0, 0, 0, V_HEIGHT);
  bgGrad.addColorStop(0, "#ffffff");
  bgGrad.addColorStop(0.6, "#f0f9ff");
  bgGrad.addColorStop(1, "#e0f2fe");
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

  ctx.strokeStyle = "rgba(2, 132, 199, 0.06)";
  ctx.lineWidth = 1;
  for (let x = 0; x < V_WIDTH; x += 20) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, V_HEIGHT); ctx.stroke();
  }
  for (let y = 0; y < V_HEIGHT; y += 20) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(V_WIDTH, y); ctx.stroke();
  }

  particles.forEach(p => {
    p.y -= p.speedY;
    if (p.y < 0) p.y = V_HEIGHT;
    ctx.fillStyle = `rgba(2, 132, 199, ${p.opacity * 0.6})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.textAlign = "center";

  // チェックマークアイコン
  const pulse = Math.sin(frames * 0.05) * 3;
  ctx.save();
  ctx.translate(V_WIDTH / 2, 82 + pulse);
  ctx.shadowColor = "rgba(2, 132, 199, 0.25)";
  ctx.shadowBlur = 15;
  ctx.fillStyle = "#0284c7";
  ctx.beginPath();
  ctx.arc(0, 0, 24, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 20px Arial";
  ctx.fillText("✓", 0, 7);
  ctx.restore();

  // タイトル
  ctx.fillStyle = "#64748b";
  ctx.font = "bold 11px Arial";
  ctx.fillText("FUN-TECH LABO ARRIVAL", V_WIDTH / 2, 128);

  ctx.fillStyle = "#0f172a";
  ctx.font = "bold 22px Arial";
  ctx.fillText("配達成功！", V_WIDTH / 2, 156);

  // メッセージカード
  const cardX = V_WIDTH / 2 - 132;
  const cardY = 178;
  const cardW = 264;
  const cardH = 88;

  ctx.save();
  ctx.shadowColor = "rgba(2, 132, 199, 0.12)";
  ctx.shadowBlur = 18;
  ctx.shadowOffsetY = 6;
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.roundRect(cardX, cardY, cardW, cardH, 18);
  ctx.fill();
  ctx.restore();

  let borderGrad = ctx.createLinearGradient(cardX, cardY, cardX + cardW, cardY + cardH);
  borderGrad.addColorStop(0, "#38bdf8");
  borderGrad.addColorStop(1, "#0284c7");
  ctx.strokeStyle = borderGrad;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(cardX, cardY, cardW, cardH, 18);
  ctx.stroke();

  ctx.fillStyle = "#0284c7";
  ctx.font = "bold 15px Arial";
  ctx.fillText("ファンテックラボへ届きました", V_WIDTH / 2, cardY + 36);

  ctx.fillStyle = "#64748b";
  ctx.font = "11.5px Arial";
  ctx.fillText("下のボタンをタップして次へお進みください", V_WIDTH / 2, cardY + 62);
}

// UI（モバイル基準クリーンレイアウト・PCでも操作可能）
function drawUI() {
  ctx.textAlign = "center";

  if (gameState === "START") {
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    ctx.beginPath();
    ctx.roundRect(V_WIDTH / 2 - 68, 72, 136, 22, 11);
    ctx.fill();
    ctx.fillStyle = "#0284c7";
    ctx.font = "bold 10px Arial";
    ctx.fillText("DRONE DELIVERY", V_WIDTH / 2, 86);

    ctx.fillStyle = "#0f172a";
    ctx.font = "bold 24px Arial";
    ctx.fillText("荷物を届けよう", V_WIDTH / 2, 120);

    const panelX = 22;
    const panelY = 212;
    const panelW = V_WIDTH - 44;
    const panelH = 152;

    ctx.save();
    ctx.shadowColor = "rgba(2, 132, 199, 0.14)";
    ctx.shadowBlur = 16;
    ctx.shadowOffsetY = 6;
    ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
    ctx.beginPath();
    ctx.roundRect(panelX, panelY, panelW, panelH, 18);
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = "rgba(56, 189, 248, 0.45)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(panelX, panelY, panelW, panelH, 18);
    ctx.stroke();

    ctx.fillStyle = "#e0f2fe";
    ctx.beginPath();
    ctx.roundRect(V_WIDTH / 2 - 46, panelY + 14, 92, 22, 11);
    ctx.fill();

    ctx.fillStyle = "#0284c7";
    ctx.font = "bold 11.5px Arial";
    ctx.fillText("あそびかた", V_WIDTH / 2, panelY + 29);

    ctx.textAlign = "left";
    const itemX = panelX + 20;

    ctx.fillStyle = "#0284c7";
    ctx.beginPath();
    ctx.arc(itemX + 8, panelY + 56, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 10px Arial";
    ctx.textAlign = "center";
    ctx.fillText("1", itemX + 8, panelY + 59.5);

    ctx.textAlign = "left";
    ctx.fillStyle = "#0f172a";
    ctx.font = "bold 12.5px Arial";
    ctx.fillText("画面をタップして上昇", itemX + 24, panelY + 60);

    ctx.fillStyle = "#0284c7";
    ctx.beginPath();
    ctx.arc(itemX + 8, panelY + 88, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 10px Arial";
    ctx.textAlign = "center";
    ctx.fillText("2", itemX + 8, panelY + 91.5);

    ctx.textAlign = "left";
    ctx.fillStyle = "#0f172a";
    ctx.font = "bold 12.5px Arial";
    ctx.fillText("指を離すとゆっくり下降", itemX + 24, panelY + 92);

    ctx.fillStyle = "#0284c7";
    ctx.beginPath();
    ctx.arc(itemX + 8, panelY + 120, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 10px Arial";
    ctx.textAlign = "center";
    ctx.fillText("3", itemX + 8, panelY + 123.5);

    ctx.textAlign = "left";
    ctx.fillStyle = "#0f172a";
    ctx.font = "bold 12.5px Arial";
    ctx.fillText("GOALゲートを通過して配達完了！", itemX + 24, panelY + 124);

    ctx.textAlign = "center";
    const pulseScale = 1 + Math.sin(frames * 0.08) * 0.025;
    ctx.save();
    ctx.translate(V_WIDTH / 2, 412);
    ctx.scale(pulseScale, pulseScale);

    ctx.shadowColor = "rgba(2, 132, 199, 0.35)";
    ctx.shadowBlur = 14;
    ctx.shadowOffsetY = 4;
    ctx.fillStyle = "#0284c7";
    ctx.beginPath();
    ctx.roundRect(-115, -20, 230, 40, 20);
    ctx.fill();

    ctx.shadowColor = "transparent";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 15px Arial";
    ctx.fillText("タップしてスタート", 0, 5);
    ctx.restore();

  } else if (gameState === "GAMEOVER") {
    const cardX = 36;
    const cardY = 175;
    const cardW = V_WIDTH - 72;
    const cardH = 135;

    ctx.save();
    ctx.shadowColor = "rgba(15, 23, 42, 0.15)";
    ctx.shadowBlur = 20;
    ctx.shadowOffsetY = 8;
    ctx.fillStyle = "rgba(255, 255, 255, 0.96)";
    ctx.beginPath();
    ctx.roundRect(cardX, cardY, cardW, cardH, 20);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = "#ef4444";
    ctx.font = "bold 22px Arial";
    ctx.fillText("ぶつかってしまった！", V_WIDTH / 2, cardY + 46);

    ctx.fillStyle = "#64748b";
    ctx.font = "12px Arial";
    ctx.fillText("障害物を避けてもう一度挑戦しよう", V_WIDTH / 2, cardY + 74);

    ctx.fillStyle = "#0284c7";
    ctx.font = "bold 14px Arial";
    ctx.fillText("画面をタップしてやり直す", V_WIDTH / 2, cardY + 108);
  }
}

function triggerGoalScene() {
  gameState = "GOAL_SCENE";
  goalStartTime = Date.now();
  if (goalTimer) clearTimeout(goalTimer);

  goalTimer = setTimeout(() => {
    gameState = "GOAL_RESULT";
    resultActions.style.display = "flex";
  }, GOAL_SCENE_DURATION);
}

function handleAction() {
  if (gameState === "START") {
    gameState = "PLAYING";
    drone.flap();
  } else if (gameState === "PLAYING") {
    drone.flap();
  } else if (gameState === "GAMEOVER") {
    resetGameToStart();
  }
}

retryBtn.addEventListener("touchstart", (e) => {
  e.stopPropagation();
});

retryBtn.addEventListener("mousedown", (e) => {
  e.stopPropagation();
});

retryBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  resetGameToStart();
});

function triggerGameOver() {
  gameState = "GAMEOVER";
}

function resetGameToStart() {
  if (goalTimer) clearTimeout(goalTimer);
  drone.reset();
  pipes.reset();
  goalGate.reset();
  passedPipesCount = 0;
  traveledPx = 0;
  resultActions.style.display = "none";
  gameState = "START";
}

// PCキーボード操作（スペースキー＆デバッグ用Gキー）
window.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    handleAction();
  }
  if (e.key === "g" || e.key === "G") {
    triggerGoalScene();
  }
});

// スマホのタップ操作
window.addEventListener("touchstart", (e) => {
  if (gameState === "GOAL_SCENE" || gameState === "GOAL_RESULT") return;
  if (e.cancelable) e.preventDefault();
  handleAction();
}, { passive: false });

// PCのマウスクリック操作
window.addEventListener("mousedown", (e) => {
  if (e.button !== 0) return;
  if (gameState === "GOAL_SCENE" || gameState === "GOAL_RESULT") return;
  handleAction();
});

function loop() {
  ctx.clearRect(0, 0, V_WIDTH, V_HEIGHT);

  if (gameState === "GOAL_SCENE") {
    drawGoalScene();
  } else if (gameState === "GOAL_RESULT") {
    drawGoalResult();
  } else {
    drawBackground();

    if (gameState === "PLAYING") {
      pipes.update();
      goalGate.update();
      drone.update();
    }

    pipes.draw();
    goalGate.draw();
    drone.draw();

    if (gameState === "PLAYING") {
      drawDistanceHUD();
    }

    drawUI();
  }

  frames++;
  requestAnimationFrame(loop);
}

loop();
</script>
